---
name: e2e
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    if: github.repository == 'kubernetes-sigs/release-sdk'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false

      - name: Run local registry
        run: podman run -d -p 5000:5000 registry:2

      - name: Build test image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        id: test-image
        with:
          base-image: scratch
          image: test
          oci: true

      - name: Push test image to local registry
        id: push
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          image: ${{ steps.test-image.outputs.image }}
          registry: localhost:5000
          tls-verify: false

      - name: Generate test file
        id: test-file
        run: |
          echo "release sign test" > ${{ runner.temp }}/test-file-${{ github.run_id }}

      - name: Run e2e tests
        run: go run mage.go E2ETest
        env:
          INPUT_PATH: ${{ runner.temp }}/test-file-${{ github.run_id }}
